<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TradingView chart</title>
<style>
:root {
  color-scheme: light dark;
  --background: light-dark(#ffffff, #17191d);
  --foreground: light-dark(#25272b, #e9ebee);
  --border: light-dark(#e1e4e8, #363b44);
  --green: light-dark(#087c62, #51cba4);
  --red: light-dark(#c53c51, #f08090);
  --viz-series-1: light-dark(#2862bf, #80b4ff);
  --viz-series-2: light-dark(#9b610b, #e6b966);
  --viz-series-3: var(--green);
  --viz-series-4: var(--red);
}
body { max-width:1100px; margin:24px auto; padding:0 16px; background:var(--background); color:var(--foreground); font:16px/1.5 system-ui,sans-serif; }
h3 { font-weight:500; }
a { color:var(--viz-series-1); }
.text-small { font-size:12px; }
.text-muted { opacity:.8; }
.tabular-nums { font-variant-numeric:tabular-nums; }
</style>
</head>
