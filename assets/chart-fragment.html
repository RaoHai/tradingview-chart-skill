<section id="__ROOT_ID__">
  <h3 class="chart-title"></h3>
  <div class="text-small text-muted chart-meta"></div>
  <div class="text-small text-muted chart-coverage"></div>
  <div class="text-small text-muted chart-retrieved"></div>
  <div class="text-small tabular-nums chart-readout"></div>
  <div class="chart-canvas" role="img"></div>
  <div class="text-small text-muted chart-legend"></div>
  <div class="text-small text-muted"><span class="chart-source-label"></span><a class="chart-source" target="_blank" rel="noopener"></a> · <a href="https://www.tradingview.com/" target="_blank" rel="noopener">TradingView Lightweight Charts™</a></div>
</section>
<style>
  #__ROOT_ID__ .chart-canvas { width:100%; height:420px; margin-block:8px; }
  #__ROOT_ID__ .chart-readout { min-height:38px; margin-top:8px; }
  #__ROOT_ID__ .chart-title { padding-right:90px; }
  #__ROOT_ID__ .chart-legend { margin-bottom:6px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.0.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
(() => {
 const root=document.getElementById('__ROOT_ID__'), data=__CHART_DATA__, bars=data.bars;
 const en=data.locale==='en-US';
 const el=root.querySelector('.chart-canvas');
 root.querySelector('.chart-source-label').textContent=en?'Data: ':'数据：';
 root.querySelector('.chart-title').textContent=data.symbol+(en?' · Daily':' · 日 K');
 root.querySelector('.chart-meta').textContent=data.currency+(en?' · As of ':' · 截至 ')+data.as_of+' · '+data.adjustment;
 const volumeCount=bars.filter(b=>b.volume!=null).length;
 root.querySelector('.chart-coverage').textContent=`${bars[0].time} — ${bars.at(-1).time} · `+(en?`${bars.length} supplied sessions · Volume ${volumeCount}/${bars.length}`:`${bars.length} 条输入日线 · 有成交量 ${volumeCount}/${bars.length}`)+(volumeCount<bars.length?(en?' · Missing volume omitted':' · 缺量已省略'):'');
 const retrieved=root.querySelector('.chart-retrieved');retrieved.textContent=data.retrieved_utc?(en?'Retrieved (UTC): ':'获取时间（UTC）：')+data.retrieved_utc:'';retrieved.hidden=!data.retrieved_utc;
 const source=root.querySelector('.chart-source'); source.textContent=data.source_name; source.href=data.source_url;
 el.setAttribute('aria-label',en?`${data.symbol} daily candles and volume, ${bars[0].time} to ${bars.at(-1).time}, last close ${bars.at(-1).close} ${data.currency}`:`${data.symbol} 日线和成交量，${bars[0].time} 至 ${bars.at(-1).time}，最新收盘 ${bars.at(-1).close} ${data.currency}`);
 if(!window.LightweightCharts){el.textContent=en?'Chart library unavailable. Check the CDN connection.':'图表库未加载，请检查 CDN 连接。';el.setAttribute('role','alert');return;}
 function color(token){const probe=document.createElement('span');probe.style.color='var('+token+')';root.appendChild(probe);const value=getComputedStyle(probe).color;probe.remove();return value;}
 const chart=LightweightCharts.createChart(el,{autoSize:true,layout:{attributionLogo:true},rightPriceScale:{scaleMargins:{top:0.08,bottom:0.26}},timeScale:{borderVisible:false},localization:{locale:en?'en-US':'zh-CN'},grid:{vertLines:{visible:false}}});
 const candles=chart.addSeries(LightweightCharts.CandlestickSeries);
 candles.setData(bars.map(({time,open,high,low,close})=>({time,open,high,low,close})));
 const volume=chart.addSeries(LightweightCharts.HistogramSeries,{priceScaleId:'volume',priceFormat:{type:'volume'},priceLineVisible:false,lastValueVisible:false});
 volume.priceScale().applyOptions({scaleMargins:{top:0.82,bottom:0},visible:false});
 const averages=[];
 for(const period of [20,50]){if(bars.length<period)continue;const series=chart.addSeries(LightweightCharts.LineSeries,{lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});series.setData(bars.slice(period-1).map((b,i)=>({time:b.time,value:bars.slice(i,i+period).reduce((s,p)=>s+p.close,0)/period})));averages.push({period,series});}
 const lines=(data.levels||[]).map(l=>({...l,line:candles.createPriceLine({price:l.price,title:l.title,lineStyle:LightweightCharts.LineStyle.Dashed,lineWidth:1,axisLabelVisible:true})}));
 function theme(){const up=color('--green'),down=color('--red'),border=color('--border');chart.applyOptions({layout:{background:{type:'solid',color:color('--background')},textColor:color('--foreground')},grid:{horzLines:{color:border}},rightPriceScale:{borderColor:border}});candles.applyOptions({upColor:up,downColor:down,wickUpColor:up,wickDownColor:down,borderVisible:false});volume.setData(bars.filter(b=>b.volume!=null).map(b=>({time:b.time,value:b.volume,color:b.close>=b.open?up:down})));averages.forEach((a,i)=>a.series.applyOptions({color:color('--viz-series-'+(i+1))}));lines.forEach(l=>l.line.applyOptions({color:color(l.kind==='support'?'--viz-series-3':'--viz-series-4')}));}
 theme();new MutationObserver(theme).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});chart.timeScale().fitContent();
 const readout=root.querySelector('.chart-readout');
 function show(b){readout.textContent=en?`${b.time}  O ${b.open.toFixed(2)}  H ${b.high.toFixed(2)}  L ${b.low.toFixed(2)}  C ${b.close.toFixed(2)}`+(b.volume!=null?`  Vol ${b.volume.toLocaleString('en-US')} shares/units`:''):`${b.time}　开 ${b.open.toFixed(2)}　高 ${b.high.toFixed(2)}　低 ${b.low.toFixed(2)}　收 ${b.close.toFixed(2)}`+(b.volume!=null?`　量 ${b.volume.toLocaleString('zh-CN')} 份/股`:'');}
 show(bars.at(-1));const byDate=new Map(bars.map(b=>[b.time,b]));chart.subscribeCrosshairMove(p=>{const t=typeof p.time==='string'?p.time:p.time&&`${p.time.year}-${String(p.time.month).padStart(2,'0')}-${String(p.time.day).padStart(2,'0')}`;show(byDate.get(t)||bars.at(-1));});
 root.querySelector('.chart-legend').textContent=[en?'Green up / red down':'绿涨红跌',volumeCount?(en?'Volume (shares/units)':'成交量（份/股）'):(en?'No volume supplied':'未提供成交量'),...averages.map(a=>'MA'+a.period),...([20,50].filter(p=>bars.length<p).map(p=>en?`MA${p}: insufficient history`:`MA${p}：样本不足`)),...(lines.length?[en?'Lines: analyst reference levels':'横线：分析参考价位']:[])].join(' · ');
})();
</script>
